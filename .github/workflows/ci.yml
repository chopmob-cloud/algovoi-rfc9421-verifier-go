# Gate every change to this verifier on the shared RFC 9421 conformance corpus.
#
# Runs the crate's own unit tests plus the rfc9421_negative cross-language
# battery (ecdsa/negative_v1_test.go) against the signed v3 corpus checked out
# from the conformance repo, so this repo's PRs are gated on byte-for-byte
# parity with the frozen oracle, including the rsa_verify section. Without the
# corpus the negative test would skip; pointing ALGOVOI_NEGATIVE_V1 at v3 makes
# it run all seven sections (signing_base, the two parse gates, keygate,
# ed25519, ecdsa, rsa) and fail closed on any divergence.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: go test + rfc9421_negative v3
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # the signed conformance corpus (the shared oracle) for the negative battery
      - uses: actions/checkout@v4
        with:
          repository: chopmob-cloud/algovoi-rfc9421-conformance
          path: _conformance

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Scoped to the negative battery only -- the exact target the conformance
      # consensus job runs for the Go column. The repo's other suites
      # (TestFrozenVectors*, TestSharedVectorsCrossLanguageParity) read reference
      # vectors from the separate algovoi-rfc9421-verifier-multilang repo and are
      # gated elsewhere; running them here would require that third checkout.
      - name: go test (rfc9421_negative v3, all seven sections incl. rsa_verify)
        env:
          ALGOVOI_NEGATIVE_V1: ${{ github.workspace }}/_conformance/corpus/rfc9421_negative_v3/rfc9421_negative_v3.json
        run: go test ./ecdsa -run TestNegativeV1 -count=1 -v
